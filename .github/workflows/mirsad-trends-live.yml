name: Mirsad Live Trend Radar

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mirsad-trends-live.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Share only the publishing lock with the news engine so two jobs do not push
# to the isolated branch at the same instant. Data and output remain separate.
concurrency:
  group: mirsad-news-publisher
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated Mirsad engine branch
        uses: actions/checkout@v4
        with:
          ref: mirsad-engine-v2
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mirsad-engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r mirsad-engine/requirements.txt

      - name: Collect independent trend signals
        run: python mirsad-engine/trends_engine.py

      - name: Validate trend feed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('mirsad-engine/trends.json',encoding='utf-8'))
          assert p.get('engine') == 'mirsad-trends-v1'
          assert p.get('sourcePolicy') == 'independent-trend-signals'
          items=p.get('items',[])
          assert len(items) >= 12
          platforms={x.get('sourcePlatform') for x in items}
          assert len(platforms) >= 2
          assert all(0 <= int(x.get('strengthScore',-1)) <= 100 for x in items)
          assert all(str(x.get('url','')).startswith('http') for x in items)
          print('MIRSAD_TREND_FEED_VALID',len(items),sorted(platforms))
          PY

      - name: Publish trend feed to isolated branch
        run: |
          git config user.name "Mirsad Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mirsad-engine/trends.json
          if git diff --cached --quiet; then
            echo "Trend feed content unchanged."
          else
            git commit -m "Mirsad: live trend radar update"
            git push origin HEAD:mirsad-engine-v2
          fi
